version: '3.4'

volumes:
  dataDb:
  dataRabbit:

services:
  gerenciadorbrokerapi:
    restart: always
    build:
      context: .
      dockerfile: GerenciadorBrokerAPI/Dockerfile

  db:
    image: mysql
    restart: always
    ports:
      - "4000:3306"
    volumes:
      - dataDb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    restart: always
    volumes:
      - dataRabbit:/var/lib/rabbitmq/mnesia/
    ports:
    - "5672:5672"
    - "15672:15672"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - 4200:4200
